<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Post - FLC Publishing House</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.29/bundled/lenis.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            flcNavy: '#1A3A52',
            flcGold: '#9A7B4F',
            flcGoldLight: '#B8956A',
            flcCharcoal: '#2C2C2C',
            flcCream: '#F5F1E8',
            flcOffWhite: '#FAFAF8',
            flcBorder: '#E5E0D8',
          },
          boxShadow: {
            premium:
              '0 10px 40px rgba(26, 58, 82, 0.10), 0 4px 12px rgba(26, 58, 82, 0.06)',
          },
        },
      },
    };
  </script>

  <style>
    /* Skip Link */
    .skip-link {
      position: absolute;
      top: -40px;
      left: 0;
      background: #1A3A52;
      color: white;
      padding: 8px 16px;
      z-index: 100;
      transition: top 0.3s;
    }
    .skip-link:focus {
      top: 0;
    }

    /* Pattern Dots */
    .pattern-dots {
      background-image: radial-gradient(circle, #E5E0D8 1px, transparent 1px);
      background-size: 24px 24px;
    }

    /* Fade In Up Animation */
    .fade-in-up {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.6s ease-out, transform 0.6s ease-out;
    }

    .fade-in-up.visible {
      opacity: 1;
      transform: translateY(0);
    }

    @media (prefers-reduced-motion: reduce) {
      .fade-in-up {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .section-kicker {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #9A7B4F;
    }

    /* Reading Progress Bar */
    .reading-progress {
      position: fixed;
      top: 0;
      left: 0;
      width: 0%;
      height: 3px;
      background: linear-gradient(90deg, #9A7B4F, #B8956A);
      z-index: 9999;
      transition: width 0.1s ease;
    }

    /* Scroll to Top Button */
    .scroll-top-btn {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      width: 3rem;
      height: 3rem;
      background: #1A3A52;
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(26, 58, 82, 0.2);
    }

    .scroll-top-btn.visible {
      opacity: 1;
      visibility: visible;
    }

    .scroll-top-btn:hover {
      background: #9A7B4F;
      transform: translateY(-2px);
    }

    .post-content {
      line-height: 1.75;
    }

    .post-content p {
      margin-bottom: 1.25rem;
    }

    .post-content h2 {
      font-size: 1.75rem;
      font-weight: 700;
      color: #1A3A52;
      margin-top: 2rem;
      margin-bottom: 1rem;
    }

    .post-content h3 {
      font-size: 1.5rem;
      font-weight: 600;
      color: #1A3A52;
      margin-top: 1.5rem;
      margin-bottom: 0.75rem;
    }

    .post-content ul, .post-content ol {
      margin-bottom: 1.25rem;
      padding-left: 1.5rem;
    }

    .post-content li {
      margin-bottom: 0.5rem;
    }

    .post-content blockquote {
      background: linear-gradient(135deg, #F5F1E8 0%, #FAFAF8 100%);
      border-left: 4px solid #9A7B4F;
      padding: 1.5rem;
      margin: 2rem 0;
      border-radius: 0.5rem;
      font-style: italic;
      color: #1A3A52;
    }

    .post-content a {
      color: #9A7B4F;
      text-decoration: underline;
    }

    .post-content a:hover {
      color: #1A3A52;
    }

    .post-content strong {
      color: #1A3A52;
      font-weight: 600;
    }

    .note-textarea {
      width: 100%;
      min-height: 100px;
      padding: 1rem;
      border: 1px solid #E5E0D8;
      border-radius: 0.5rem;
      font-family: inherit;
      font-size: 0.875rem;
      resize: vertical;
    }

    .note-textarea:focus {
      outline: none;
      border-color: #9A7B4F;
    }

    /* Skeleton Loading */
    .skeleton {
      background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      animation: skeleton-loading 1.5s infinite;
    }

    @keyframes skeleton-loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
  <link rel="stylesheet" href="../assets/css/site-theme.css" />
  <link rel="stylesheet" href="../assets/css/sermon-page.css" />
</head>

<body class="text-flcCharcoal text-base lg:text-lg">
  <a href="#main-content" class="skip-link">Skip to content</a>
  
  <!-- Reading Progress Bar -->
  <div class="reading-progress" id="readingProgress"></div>
  
  <!-- Header Container -->
  <div id="headerContainer"
       data-config='{"currentPage":"post","basePath":"..","logoPath":"../assets/images/Logo.png","homePath":"../index.html","libraryPath":"../pages/resources.html","devotionalsPath":"../pages/devotionals.html","resourcesPath":"../pages/resources.html","logoHeight":"105px"}'></div>
  
  <!-- Load Header Component -->
  <script src="../assets/js/components/header-component.js"></script>
  
  <script type="module" src="../assets/js/config.js"></script>
  <script type="module" src="../assets/js/pages/post.js"></script>
  
  <main id="main-content" class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-10">
    <!-- Loading State -->
    <div id="loadingState" class="fade-in-up">
      <div class="h-8 w-32 skeleton rounded mb-4"></div>
      <div class="h-12 w-3/4 skeleton rounded mb-6"></div>
      <div class="h-4 w-full skeleton rounded mb-3"></div>
      <div class="h-4 w-full skeleton rounded mb-3"></div>
      <div class="h-4 w-2/3 skeleton rounded mb-3"></div>
    </div>

    <!-- Error State -->
    <div id="errorState" class="hidden text-center py-20">
      <p class="text-flcCharcoal/70 mb-4">Failed to load post. Please try again later.</p>
      <a href="../pages/sermons.html" class="btn-primary px-6 py-3 text-sm sm:text-base">
        Back to Sermons
      </a>
    </div>

    <!-- Post Content -->
    <article id="postContent" class="hidden">
      <!-- Hero Section -->
      <section class="relative pt-12 sm:pt-16 pb-8 sm:pb-12 lg:pt-24 lg:pb-16 overflow-hidden fade-in-up" id="heroSection">
        <!-- Decorative line elements -->
        <div class="absolute top-20 left-8 w-px h-32 bg-gradient-to-b from-transparent via-flcGold/30 to-transparent hidden lg:block"></div>
        <div class="absolute top-32 right-12 w-24 h-px bg-gradient-to-r from-transparent via-flcGold/20 to-transparent hidden lg:block"></div>
        
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
          <!-- Asymmetric Layout -->
          <div class="flex flex-col lg:flex-row lg:gap-16">
            <!-- Left Column - Meta Line -->
            <div class="lg:w-1/4 lg:pt-8">
              <div class="flex items-center space-x-4 mb-8 lg:flex-col lg:items-start lg:space-x-0 lg:space-y-3">
                <p class="text-[0.75rem] uppercase tracking-[0.12em] text-flcGold/70 font-medium" id="postPastor">
                  Loading...
                </p>
                <span class="text-flcGold/30 lg:hidden">•</span>
                <p class="text-[0.75rem] uppercase tracking-[0.12em] text-flcCharcoal/50 font-medium" id="postDate">
                  Loading...
                </p>
              </div>
            </div>
            
            <!-- Right Column - Title, Excerpt, Image, Video -->
            <div class="lg:w-3/4 text-center lg:text-left">
              <!-- Title -->
              <h1 class="font-heading font-bold text-[clamp(2.5rem,5vw,4rem)] text-flcNavy leading-[1.1] tracking-[-0.035em] mb-8" id="postTitle">
                Loading...
              </h1>
              
              <!-- Optional excerpt -->
              <p class="text-[1.05rem] text-flcCharcoal/70 leading-[1.8] max-w-[70ch] mb-12" id="postExcerpt">
                Loading...
              </p>
              
              <!-- Featured Image -->
              <div id="postImageContainer" class="max-w-4xl mx-auto lg:mx-0 mb-12 hidden">
                <div class="relative rounded-[20px] overflow-hidden shadow-[0_32px_96px_rgba(26,58,82,0.12)] group">
                  <div class="absolute inset-0 bg-gradient-to-t from-black/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
                  <img id="heroImage" class="w-full h-auto transition-transform duration-700 group-hover:scale-[1.03]" loading="eager" alt="" />
                </div>
              </div>

              <!-- YouTube Video Embed -->
              <div id="youtubeVideoContainer" class="max-w-4xl mx-auto lg:mx-0 hidden">
                <!-- Video will be embedded here -->
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- Main Content -->
      <div class="relative px-4 sm:px-6 lg:px-8">
        <!-- Post Body -->
        <div class="post-content fade-in-up" id="postBody">
          <!-- Content will be loaded here -->
        </div>
      </div>

            <!-- Sidebar (Fixed position on right, outside content flow) -->
  <aside class="hidden lg:block fixed right-8 top-24 w-80 z-50">
    <div class="bg-white/60 backdrop-blur-sm rounded-2xl border border-flcBorder/40 p-6 shadow-[0_8px_32px rgba(26,58,82,0.04)]">
      <!-- Decorative line -->
      <div class="w-px h-16 bg-gradient-to-b from-flcGold/20 to-transparent mb-6"></div>
      
      <!-- Reading Progress -->
      <h3 class="font-heading text-sm font-bold text-flcNavy mb-6 tracking-tight uppercase tracking-[0.08em]">Reading Progress</h3>
      <div class="relative h-1 bg-flcBorder/50 rounded-full overflow-hidden mb-4">
        <div id="sidebarProgress" class="absolute top-0 left-0 h-full bg-gradient-to-r from-flcGold to-flcGoldLight transition-all duration-300" style="width: 0%"></div>
      </div>
      <p class="text-xs text-flcCharcoal/60 mb-8" id="sidebarProgressText">0% complete</p>
      
      <!-- Reading Time -->
      <div class="pt-6 border-t border-flcBorder/40 mb-6">
        <p class="text-[0.75rem] uppercase tracking-[0.12em] text-flcGold/70 font-medium mb-2">Reading Time</p>
        <p class="text-2xl font-heading font-bold text-flcNavy" id="readingTime">-- min</p>
      </div>
      
      <!-- Word Count -->
      <div class="pt-6 border-t border-flcBorder/40 mb-6">
        <p class="text-[0.75rem] uppercase tracking-[0.12em] text-flcGold/70 font-medium mb-2">Word Count</p>
        <p class="text-2xl font-heading font-bold text-flcNavy" id="wordCount">-- words</p>
      </div>
      
      <!-- Recommended Posts -->
      <div class="pt-6 border-t border-flcBorder/40 mb-6">
        <p class="text-[0.75rem] uppercase tracking-[0.12em] text-flcGold/70 font-medium mb-4">Recommended</p>
        <div id="sidebarRecommendedPosts" class="space-y-4">
          <!-- Recommended posts will be loaded here -->
        </div>
      </div>
      
      <!-- Share -->
      <div class="mt-8 pt-6 border-t border-flcBorder/40">
        <h3 class="font-heading text-sm font-bold text-flcNavy mb-4 tracking-tight uppercase tracking-[0.08em]">Share</h3>
        <div class="flex gap-3">
          <button class="w-10 h-10 rounded-full bg-flcNavy/5 hover:bg-flcNavy/10 flex items-center justify-center transition-colors duration-200">
            <svg class="w-4 h-4 text-flcNavy/70" fill="currentColor" viewBox="0 0 24 24">
              <path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/>
            </svg>
          </button>
          <button class="w-10 h-10 rounded-full bg-flcNavy/5 hover:bg-flcNavy/10 flex items-center justify-center transition-colors duration-200">
            <svg class="w-4 h-4 text-flcNavy/70" fill="currentColor" viewBox="0 0 24 24">
              <path d="M22.46 6c-.77.35-1.6.58-2.46.69.88-.53 1.56-1.37 1.88-2.38-.83.5-1.75.85-2.72 1.05C18.37 4.5 17.26 4 16 4c-2.35 0-4.27 1.92-4.27 4.29 0 .34.04.67.11.98C8.28 9.09 5.11 7.38 3 4.79c-.37.63-.58 1.37-.58 2.15 0 1.49.75 2.81 1.91 3.56-.71-.05-1.37-.21-1.95-.52v.03c0 2.08 1.48 3.82 3.44 4.21a4.22 4.22 0 0 1-1.93.07 4.28 4.28 0 0 0 4 2.98 8.521 8.521 0 0 1-5.33 1.84c-.34 0-.68-.02-1.02-.06C3.44 20.29 5.7 21 8.12 21 16 21 20.33 16.9 22 12 22 11.7 22 11.42 22 11.14 22 11.14 22 11.14 22 11.14 22c5.93 0 10.95-4.48 11.64-10.48.23-.7.35-1.44.35-2.2 0-.06 0-.12-.01-.18z"/>
            </svg>
          </button>
          <button class="w-10 h-10 rounded-full bg-flcNavy/5 hover:bg-flcNavy/10 flex items-center justify-center transition-colors duration-200">
            <svg class="w-4 h-4 text-flcNavy/70" fill="currentColor" viewBox="0 0 24 24">
              <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </aside>

      <!-- Notes Section -->
      <section class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 mt-20 mb-20 fade-in-up">
        <div class="bg-gradient-to-br from-flcCream/95 to-flcOffWhite/95 backdrop-blur-sm rounded-2xl shadow-[0_8px_32px_rgba(26,58,82,0.06)] p-8 sm:p-12 lg:p-16 border border-flcBorder/50">
          <h2 class="font-heading text-2xl lg:text-3xl font-bold text-flcNavy mb-8 flex items-center tracking-tight">
            <svg class="w-6 h-6 mr-3 text-flcGold" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
            </svg>
            Your Notes
          </h2>
          <textarea 
            class="note-textarea w-full min-h-56 p-6 bg-white/95 backdrop-blur-sm border-2 border-flcBorder/50 rounded-xl focus:border-flcGold focus:ring-4 focus:ring-flcGold/10 transition-all duration-300 text-base leading-relaxed resize-none" 
            data-note="main"
            placeholder="Take notes here... (Your notes are saved automatically)"
          ></textarea>
        </div>
      </section>

      <!-- Back to Sermons -->
      <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 mb-20 text-center fade-in-up">
        <a href="../pages/sermons.html" class="inline-flex items-center px-8 py-4 bg-gradient-to-r from-flcNavy to-flcNavyLight text-white font-semibold rounded-xl hover:from-flcGold hover:to-flcGoldLight transition-all duration-500 shadow-[0_8px_24px_rgba(26,58,82,0.15)] hover:shadow-[0_12px_32px_rgba(154,123,79,0.25)] transform hover:-translate-y-1">
          <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
          </svg>
          Back to All Sermons
        </a>
      </div>
    </article>
  </main>

  <!-- Scroll to Top Button -->
  <div class="scroll-top-btn" id="scrollTop">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"></path>
    </svg>
  </div>

  <!-- Footer Container -->
  <div id="footerContainer"
       data-config='{"currentPage":"post","basePath":"..","logoPath":"../assets/images/Logo.png","homePath":"../index.html","libraryPath":"../pages/resources.html","devotionalsPath":"../pages/devotionals.html","resourcesPath":"../pages/resources.html","logoHeight":"105px"}'></div>
  
  <!-- Load Footer Component -->
  <script src="../assets/js/components/footer-component.js"></script>
  
  <script src="../assets/js/lib/site-theme.js"></script>
</body>
</html>
