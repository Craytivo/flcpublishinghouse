 <style>
 /* Skip Link */
 .skip-link {
 position: absolute;
 top: -40px;
 left: 0;
 background: #1A3A52;
 color: white;
 padding: 8px 16px;
 z-index: 100;
 transition: top 0.3s;
 }
 .skip-link:focus {
 top: 0;
 }

 /* Pattern Dots */
 .pattern-dots {
 background-image: radial-gradient(circle, #E5E0D8 1px, transparent 1px);
 background-size: 24px 24px;
 }

 /* Fade In Up Animation */
 .fade-in-up {
 opacity: 0;
 transform: translateY(20px);
 transition: opacity 0.5s cubic-bezier(.16,1,.3,1), transform 0.5s cubic-bezier(.16,1,.3,1);
 }

 .fade-in-up.visible {
 opacity: 1;
 transform: translateY(0);
 }

 @media (prefers-reduced-motion: reduce) {
 .fade-in-up {
 opacity: 1;
 transform: translateY(0);
 }
 }

 .section-kicker {
 font-size: 0.75rem;
 font-weight: 600;
 letter-spacing: 0.1em;
 text-transform: uppercase;
 color: #9A7B4F;
 }

 /* Reading Progress Bar */
 .reading-progress {
 position: fixed;
 top: 0;
 left: 0;
 width: 0%;
 height: 3px;
 background: linear-gradient(90deg, #9A7B4F, #B8956A);
 z-index: 9999;
 transition: width 0.1s ease;
 }

 /* Scroll to Top Button */
 .scroll-top-btn {
 position: fixed;
 bottom: 2rem;
 right: 2rem;
 width: 3rem;
 height: 3rem;
 background: #1A3A52;
 color: white;
 border-radius: 50%;
 display: flex;
 align-items: center;
 justify-content: center;
 opacity: 0;
 visibility: hidden;
 transition: all 0.3s ease;
 cursor: pointer;
 box-shadow: 0 4px 12px rgba(26, 58, 82, 0.2);
 }

 .scroll-top-btn.visible {
 opacity: 1;
 visibility: visible;
 }

 .scroll-top-btn:hover {
 background: #9A7B4F;
 transform: translateY(-2px);
 }

 .note-textarea {
 width: 100%;
 min-height: 100px;
 padding: 1rem;
 border: 1px solid #E5E0D8;
 border-radius: 0.5rem;
 font-family: inherit;
 font-size: 0.875rem;
 resize: vertical;
 }

 .note-textarea:focus {
 outline: none;
 border-color: #9A7B4F;
 }
 </style>
<link rel="stylesheet" href="../assets/css/consolidated-styles.css" />

</head>
